name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native PowerShell checks
        shell: pwsh
        run: ./ninfer-manager.ps1 -Action SelfTest
      - name: Check whitespace
        shell: pwsh
        run: git diff --check